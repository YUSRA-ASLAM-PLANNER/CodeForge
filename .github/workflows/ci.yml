name: CodeForge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Check out CodeForge
        uses: actions/checkout@v4

      - name: Exercise the CodeForge GitHub Action
        uses: ./
        with:
          repository-path: .
          spec: examples/analysis-spec.json
          node-version: ${{ matrix.node }}

      - name: Build and run all workspace tests
        run: npm test
